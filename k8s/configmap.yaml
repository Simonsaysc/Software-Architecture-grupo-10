apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_NAME: book_reviews
  DB_HOST: postgres-service
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  ENABLE_CACHE: "true"
  SEARCH_HOST: opensearch-service
  SEARCH_PORT: "9200"
  ENABLE_SEARCH: "true"
  SEARCH_PROTOCOL: "https"
  OPENSEARCH_REJECT_UNAUTHORIZED: "false"

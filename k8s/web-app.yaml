apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: software-arch-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Database Configuration
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            # Redis Cache Configuration
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: ENABLE_CACHE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENABLE_CACHE
            # OpenSearch Configuration
            - name: SEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SEARCH_HOST
            - name: SEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SEARCH_PORT
            - name: ENABLE_SEARCH
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENABLE_SEARCH
            - name: SEARCH_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SEARCH_PROTOCOL
            - name: OPENSEARCH_REJECT_UNAUTHORIZED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OPENSEARCH_REJECT_UNAUTHORIZED
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: OPENSEARCH_USERNAME
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: OPENSEARCH_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080

services:
  traefik:
    image: traefik:latest
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    depends_on:
      - app

  static-assets:
    image: nginx:alpine
    restart: always
    volumes:
      - ./traefik/static-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static-assets.rule=(Host(`bookreviews.localhost`) || Host(`bookreviews.local`) || Host(`localhost`)) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.static-assets.entrypoints=websecure"
      - "traefik.http.routers.static-assets.tls=true"
      - "traefik.http.routers.static-assets.priority=100"
      - "traefik.http.routers.static-assets.middlewares=static-cache@file,gzip-compress@file"
      - "traefik.http.services.static-assets.loadbalancer.server.port=80"

  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    deploy:
      replicas: 3
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_CACHE: "true"
      SEARCH_HOST: opensearch
      SEARCH_PORT: 9200
      ENABLE_SEARCH: "true"
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      OPENSEARCH_REJECT_UNAUTHORIZED: "false"
      DOMAIN: ${DOMAIN:-bookreviews.localhost}
      UPLOADS_PATH: /app/uploads
      SESSION_SECRET: ${SESSION_SECRET:-bookreviews_session_secret_key}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`bookreviews.localhost`) || Host(`bookreviews.local`) || Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.priority=50"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
  
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
  
  opensearch:
    image: opensearchproject/opensearch:2.9.0
    container_name: opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_REJECT_UNAUTHORIZED=${OPENSEARCH_REJECT_UNAUTHORIZED}
    ports:
      - "9200:9200"

volumes:
  db_data: